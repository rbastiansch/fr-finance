services:
  fr-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.production
    image: fr-api:production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3334}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - '3334:3334'
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3334/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
