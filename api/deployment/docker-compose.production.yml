services:
  fr-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - fr-db-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  fr-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.production
    image: fr-api:production
    restart: unless-stopped
    depends_on:
      fr-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3334}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fr-db:5432/${POSTGRES_DB}?schema=public&connect_timeout=300
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - '3334:3334'
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3334/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  fr-db-production-data:
